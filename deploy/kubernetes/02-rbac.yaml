apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lamssa-pod-reader
  namespace: lamssa-production
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lamssa-api-pod-reader-binding
  namespace: lamssa-production
subjects:
  - kind: ServiceAccount
    name: lamssa-api-sa
    namespace: lamssa-production
roleRef:
  kind: Role
  name: lamssa-pod-reader
  apiGroup: rbac.authorization.k8s.io
