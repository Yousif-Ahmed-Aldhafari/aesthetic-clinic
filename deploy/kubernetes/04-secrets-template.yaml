# ExternalSecret manifest template — syncs from AWS Secrets Manager / Vault into in-memory K8s secrets
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: lamssa-secret-store
  namespace: lamssa-production
spec:
  provider:
    aws:
      service: SecretsManager
      region: me-central2
      auth:
        jwt:
          serviceAccountRef:
            name: lamssa-api-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: lamssa-api-secrets
  namespace: lamssa-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: lamssa-secret-store
    kind: SecretStore
  target:
    name: lamssa-api-secrets
    creationPolicy: Owner
  data:
    - secretKey: APP_DATABASE_PASSWORD
      remoteRef:
        key: production/lamssa/database/app_password
    - secretKey: AUTH_CSRF_SECRET
      remoteRef:
        key: production/lamssa/auth/csrf_secret
    - secretKey: MFA_ENCRYPTION_KEY
      remoteRef:
        key: production/lamssa/auth/mfa_encryption_key
    - secretKey: CLINICAL_MEDIA_ENCRYPTION_KEY
      remoteRef:
        key: production/lamssa/clinical/media_encryption_key
    - secretKey: METRICS_SECRET_KEY
      remoteRef:
        key: production/lamssa/observability/metrics_secret_key
