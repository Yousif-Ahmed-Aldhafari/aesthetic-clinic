apiVersion: batch/v1
kind: Job
metadata:
  name: lamssa-migrate
  namespace: lamssa-production
  labels:
    app.kubernetes.io/name: lamssa-migration
    app.kubernetes.io/part-of: lamssa-platform
spec:
  backoffLimit: 1 # Fail fast on migration error; do not loop
  ttlSecondsAfterFinished: 86400 # 24 hours retention of logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lamssa-migration
    spec:
      serviceAccountName: lamssa-migration-sa
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrator
          image: registry.lamssa.internal/lamssa-api:0.1.0-prod
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - "npm run db:migrate && npm run db:grant"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: RUNTIME_DATABASE_ROLE
              value: "lamssa_app"
            - name: MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lamssa-api-secrets
                  key: MIGRATION_DATABASE_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lamssa-api-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
