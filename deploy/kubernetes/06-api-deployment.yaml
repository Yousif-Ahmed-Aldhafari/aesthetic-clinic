apiVersion: apps/v1
kind: Deployment
metadata:
  name: lamssa-api
  namespace: lamssa-production
  labels:
    app.kubernetes.io/name: lamssa-api
    app.kubernetes.io/part-of: lamssa-platform
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: lamssa-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lamssa-api
    spec:
      serviceAccountName: lamssa-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.lamssa.internal/lamssa-api:0.1.0-prod
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          envFrom:
            - configMapRef:
                name: lamssa-api-config
            - secretRef:
                name: lamssa-api-secrets
          env:
            - name: DATABASE_URL
              value: "postgresql://lamssa_app:$(APP_DATABASE_PASSWORD)@pgbouncer.lamssa-production.svc.cluster.local:6432/lamssa_production?schema=public&sslmode=verify-full&pgbouncer=true"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
          ports:
            - containerPort: 3000
              name: http-api
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
              httpHeaders:
                - name: Host
                  value: api
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3000
              httpHeaders:
                - name: Host
                  value: api
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lamssa-api
  namespace: lamssa-production
  labels:
    app.kubernetes.io/name: lamssa-api
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http-api
  selector:
    app.kubernetes.io/name: lamssa-api
